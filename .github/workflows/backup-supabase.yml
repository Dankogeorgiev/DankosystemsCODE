name: Резервно копие на Supabase (дневно)

# Прави пълен pg_dump на базата всяка нощ и го качва като артефакт в GitHub
# (пази се 90 дни). Не пипа нищо в базата — само чете.
#
# ЕДНОКРАТНА НАСТРОЙКА:
# 1) Supabase → Project Settings → Database → Connection string → таб
#    „Session pooler" (задължително той, не „Transaction pooler" —
#    pg_dump не работи през 6543, а и прекият адрес е само IPv6).
#    Изглежда така:
#    postgresql://postgres.hwbblteomrrahfrsyuow:ПАРОЛАТА@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
# 2) GitHub → Settings → Secrets and variables → Actions → New repository secret
#    Име: SUPABASE_DB_URL   Стойност: низът отгоре (с истинската парола)
# 3) Готово. Ръчен тест: Actions → този workflow → Run workflow.
#
# ВЪЗСТАНОВЯВАНЕ (ако някога дотрябва):
#   pg_restore --no-owner --no-privileges -d "ВРЪЗКАТА" supabase-2026-08-05.dump
# Може и само една таблица:  pg_restore ... -t tasks

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 04:00 бълг. лятно / 03:00 зимно
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Проверка за настройката
        run: |
          if [ -z "$DB_URL" ]; then
            echo "SKIP=1" >> $GITHUB_ENV
            echo "::warning::Липсва secret SUPABASE_DB_URL — копието се пропуска. Виж коментара в началото на файла."
          fi

      - name: Дъмп на базата
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          echo "STAMP=$DATE" >> $GITHUB_ENV
          # pg_dump 17 в контейнер — работи и срещу по-стар сървър.
          docker run --rm -v "$PWD:/out" -e PGCONNECT_TIMEOUT=30 postgres:17-alpine \
            pg_dump --no-owner --no-privileges --schema=public -Fc \
                    -f "/out/supabase-$DATE.dump" "$DB_URL"
          # Втора, четима версия (обикновен SQL) — удобна за поглед с очи.
          docker run --rm -v "$PWD:/out" -e PGCONNECT_TIMEOUT=30 postgres:17-alpine \
            pg_dump --no-owner --no-privileges --schema=public --clean --if-exists \
                    -f "/out/supabase-$DATE.sql" "$DB_URL"
          gzip -9 "supabase-$DATE.sql"
          ls -lh supabase-$DATE.*

      - name: Качване на копието
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.STAMP }}
          path: |
            supabase-*.dump
            supabase-*.sql.gz
          retention-days: 90
          if-no-files-found: error
