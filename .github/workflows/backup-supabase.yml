name: Резервно копие на Supabase (дневно)

# Прави пълен pg_dump на базата всяка нощ, КРИПТИРА го и го качва като
# артефакт в GitHub (пази се 90 дни). Не пипа нищо в базата — само чете.
#
# ⚠ ЗАЩО КРИПТИРАНЕ: това хранилище е ПУБЛИЧНО, а артефактите на публично
# хранилище са достъпни за всеки. Затова копието се заключва с парола (AES256)
# и без нея файлът е безполезен.
#
# ЕДНОКРАТНА НАСТРОЙКА — три неща:
#
# 1) DEFAULT BRANCH да е „main".
#    Settings → General → Default branch → main
#    (Насрочените задачи и бутонът „Run workflow" работят САМО от главния клон.)
#
# 2) Secret SUPABASE_DB_URL
#    Supabase → бутон „Connect" горе → таб „Session pooler" (Shared) →
#    копирай URI и смени [YOUR-PASSWORD] с истинската парола:
#    postgresql://postgres.hwbblteomrrahfrsyuow:ПАРОЛА@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
#    GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# 2б) Secret SUPABASE_DB_PASSWORD (ПРЕПОРЪЧВА СЕ)
#    Само паролата на базата, както си е — без кодиране и без скоби. Когато я
#    има, тя се подава отделно (PGPASSWORD) и специалните знаци в нея НЕ могат
#    да счупят адреса. Тогава паролата в SUPABASE_DB_URL се пренебрегва.
#
# 3) Secret BACKUP_PASSPHRASE
#    Дълга парола, която ЗАПАЗВАШ отделно (мениджър на пароли / хартия в сейфа).
#    Без нея копието НЕ може да се отвори — включително от теб.
#
# ВЪЗСТАНОВЯВАНЕ:
#   gpg --decrypt --output backup.tar supabase-2026-08-05.tar.gpg
#   tar -xf backup.tar
#   pg_restore --no-owner --no-privileges -d "ВРЪЗКАТА" supabase-2026-08-05.dump
#   (само една таблица:  pg_restore ... -t tasks)

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 04:00 бълг. лятно / 03:00 зимно
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Проверка на настройките
        run: |
          bad=0
          if [ -z "$DB_URL" ]; then
            echo "::error::Липсва secret SUPABASE_DB_URL (виж коментара в началото на файла)."; bad=1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::Липсва secret BACKUP_PASSPHRASE. Хранилището е публично — без парола копието НЕ се качва."; bad=1
          fi
          [ "$bad" = "0" ]

      - name: Дъмп на базата
        run: |
          set -euo pipefail
          # Изчистваме случайни интервали/нови редове от копирането.
          URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Трябва да е URI. Ако е копиран редът с „psql …" или само хостът,
          # pg_dump го взима за име на база и търси сървър на локален сокет.
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL не е валиден адрес. Трябва да започва с postgresql:// — например postgresql://postgres.hwbblteomrrahfrsyuow:ПАРОЛА@aws-0-eu-west-1.pooler.supabase.com:5432/postgres . (Ако си копирал реда, който започва с 'psql', вземи вместо него формата URI от Supabase → Connect → Session pooler.)"
              exit 1;;
          esac
          # Диагностика БЕЗ паролата: потребител и хост:порт.
          rest="${URL#*://}"; userinfo="${rest%%@*}"; hostpart="${rest#*@}"
          user="${userinfo%%:*}"; hostport="${hostpart%%/*}"
          echo "Връзка: потребител=$user · хост=$hostport"
          case "$user" in
            postgres.*) ;;
            *) echo "::warning::Потребителят е '$user'. При Session pooler трябва да е postgres.<код на проекта> — иначе базата отказва.";;
          esac
          case "$hostport" in
            *pooler.supabase.com:5432) ;;
            *:6543) echo "::warning::Порт 6543 е Transaction pooler — pg_dump не работи през него. Трябва Session pooler на 5432.";;
            *) echo "::warning::Хостът не изглежда като Shared pooler (aws-0-…pooler.supabase.com:5432).";;
          esac
          DATE=$(date -u +%Y-%m-%d)
          echo "STAMP=$DATE" >> $GITHUB_ENV
          host="${hostport%%:*}"; port="${hostport#*:}"
          if [ "$port" = "$host" ]; then port=5432; fi
          case "$hostpart" in
            */*) dbname="${hostpart#*/}"; dbname="${dbname%%\?*}";;
            *)   dbname="";;
          esac
          if [ -z "$dbname" ]; then dbname=postgres; fi
          # Ако паролата е дадена ОТДЕЛНО — подаваме я през PGPASSWORD и не
          # минава през адреса. Така никакъв знак в нея не може да счупи нищо.
          if [ -n "${DB_PASS:-}" ]; then
            echo "Парола: от secret SUPABASE_DB_PASSWORD (извън адреса)"
            run_dump() { docker run --rm -v "$PWD:/out" -e PGPASSWORD="$DB_PASS" postgres:17-alpine \
              pg_dump --no-owner --no-privileges --schema=public -h "$host" -p "$port" -U "$user" -d "$dbname" "$@"; }
          else
            echo "Парола: от адреса (ако има специални знаци, добави secret SUPABASE_DB_PASSWORD)"
            run_dump() { docker run --rm -v "$PWD:/out" postgres:17-alpine \
              pg_dump --no-owner --no-privileges --schema=public "$URL" "$@"; }
          fi
          run_dump -Fc -f "/out/supabase-$DATE.dump"
          # Втора, четима версия (обикновен SQL) — удобна за поглед с очи.
          run_dump --clean --if-exists -f "/out/supabase-$DATE.sql"
          ls -lh supabase-$DATE.*

      - name: Заключване с парола (AES256)
        run: |
          set -euo pipefail
          DATE="$STAMP"
          tar -cf "backup-$DATE.tar" "supabase-$DATE.dump" "supabase-$DATE.sql"
          gpg --batch --yes --symmetric --cipher-algo AES256 --compress-algo 2 \
              --passphrase "$PASS" -o "supabase-$DATE.tar.gpg" "backup-$DATE.tar"
          # Незащитените файлове НЕ напускат машината.
          rm -f "supabase-$DATE.dump" "supabase-$DATE.sql" "backup-$DATE.tar"
          ls -lh "supabase-$DATE.tar.gpg"

      - name: Качване на копието
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.STAMP }}
          path: supabase-*.tar.gpg
          retention-days: 90
          if-no-files-found: error
